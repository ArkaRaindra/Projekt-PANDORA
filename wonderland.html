<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderland</title>
    <link rel="icon" type="image/jpg" href="img/AliceSprite.png" alt="favicon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }

        .blink-container {
            position: fixed;
            inset: 0;
            background-image: url('img/alicebanner.gif');
            background-repeat: repeat;
            background-size: auto;
            animation: fastBlink 0.1s infinite alternate;
        }

        @font-face {
            font-family: 'Lolita';
            src: url('fonts/lolita.ttf') format('truetype');
        }

        @fontface {
            font-family: 'VL';
            src: url('fonts/VL-Gothic-Regular.ttf') format('truetype');
        }

        @keyframes fastBlink {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0.1;
            }
        }

        h1 {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Lolita', sans-serif;
            font-size: clamp(24px, 5vw, 64px);
            color: #ea0c0c;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            z-index: 10;
            margin: 0;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="blink-container"></div>
    <a href="index.html" onclick="sessionStorage.setItem('playAlice','true')"><h1>Welcome to Wonderland</h1></a>
    <audio id="wonderland-audio" preload="auto" autoplay loop>
        <source src="audio/corps choir01.ogg" type="audio/mpeg">
    </audio>
</body>
</html>
